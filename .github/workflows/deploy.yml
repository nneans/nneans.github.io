name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    env:
      VITE_HIT_COUNTER_API_URL: ${{ vars.VITE_HIT_COUNTER_API_URL }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Test 🧪
        run: npm test
      - name: Build 🔧
        run: npm run build
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
